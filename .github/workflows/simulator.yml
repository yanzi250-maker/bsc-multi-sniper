name: BSC Simulator Test

on:
  workflow_dispatch:

jobs:
  simulation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Check TypeScript
        run: npm run typecheck

      - name: Run simulator
        run: npm start

      - name: Test BSC WebSocket listener
        run: npx tsx src/bsc-listener.ts
        timeout-minutes: 2

      - name: Test PancakeSwap V2 PairCreated listener
        run: npx tsx src/pancake-listener.ts
        timeout-minutes: 2
